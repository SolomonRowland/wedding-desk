<style>
/* Layout: a single phone-width app column on a blush ground; tab bar pinned to the bottom of the column.
   Palette and type come straight from The Wedding Desk workbook and user guide. One deliberate light look. */
:root {
  --ground: #F6ECEB;
  --surface: #FFFFFF;
  --petal: #FBF3F2;
  --blush: #F2DCDB;
  --line: #EEDCDB;
  --rose: #D99694;
  --deep: #953735;
  --hdr: #A95450;
  --plum: #93566A;
  --dplum: #74485A;
  --mauve: #C39AA6;
  --smauve: #E3CCD2;
  --ink: #3F2A29;
  --muted: #7A6260;
  --label: #93566A;
  --alert: #A6231F;
  --alertbg: #F8E1DF;
  --warn: #9A4A0A;
  --warnbg: #FBEBDD;
  --okbg: #F7E6EA;
  --display: "Cormorant", "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  color-scheme: light;
}
html, body { height: 100%; }
body { font-variant-numeric: lining-nums; background: var(--ground); color: var(--ink); font: 400 14px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: lining-nums tabular-nums; }
.tile .v, .loose b, .date b, .money-sum .v, .hero .count b, .tcard .h b { font-variant-numeric: lining-nums tabular-nums; }

.app { max-width: 460px; margin: 0 auto; min-height: 100%; background: var(--petal); position: relative; box-shadow: 0 0 0 1px var(--line), 0 30px 80px -40px rgba(85,58,77,.35); }
@media (min-width: 520px) { body { padding-block: 24px; } .app { border-radius: 28px; overflow: hidden; min-height: calc(100% - 48px); } }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--petal); padding: 14px max(18px, env(safe-area-inset-right, 0px)) 10px max(18px, env(safe-area-inset-left, 0px)); display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 1px solid transparent; transition: border-color .2s; }
.top.scrolled { border-bottom-color: var(--line); }
.top h1 { font: 600 30px/1 var(--display); color: var(--deep); margin: 0; letter-spacing: -.01em; }
.top .eyebrow { font: 600 10.5px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--mauve); margin-bottom: 4px; }
.top .act { display: flex; gap: 8px; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--plum); }
.iconbtn svg { width: 18px; height: 18px; }

main { padding: 4px max(16px, env(safe-area-inset-right, 0px)) 110px max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

/* bottom tabs */
.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 460px; z-index: 8; background: rgba(255,255,255,.94); backdrop-filter: blur(12px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
@media (min-width: 520px) { .tabs { bottom: 0; border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: 0; box-shadow: 0 -8px 24px -18px rgba(149,55,53,.35); } }
.tab { display: grid; justify-items: center; gap: 3px; padding: 6px 0 2px; font: 500 10.5px var(--body); color: var(--muted); border-radius: 12px; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--deep); }
.tab[aria-current="page"] .dot { background: var(--deep); }
.tab .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }

/* hero */
.hero { background: var(--deep); color: #fff; border-radius: 22px; padding: 20px 20px 18px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; border: 1.5px solid rgba(242,220,219,.25); box-shadow: 46px 26px 0 -1.5px rgba(242,220,219,0), 46px 26px 0 0 rgba(242,220,219,.18); }
.hero .k { font: 600 10.5px var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--blush); }
.hero h2 { font: 600 28px/1.05 var(--display); margin: 6px 0 4px; text-wrap: balance; }
.hero .sub { color: var(--blush); font-size: 12.5px; }
.hero .count { display: flex; align-items: baseline; gap: 8px; margin-top: 16px; }
.hero .count b { font: 600 54px/0.9 var(--display); }
.hero .count span { font-size: 13px; color: var(--blush); }
.tl { margin-top: 14px; }
.tl .bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
.tl .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--rose), #F6D4D2); }
.tl .lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--blush); margin-top: 6px; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border-radius: var(--r); padding: 11px 11px 10px; border-top: 3px solid var(--c, var(--plum)); text-align: left; display: grid; gap: 2px; min-width: 0; }
.tile .l { font: 600 9.5px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.tile .v { font: 600 30px/1 var(--display); color: var(--c); }
.tile .s { font-size: 10.5px; color: var(--muted); line-height: 1.3; }
.tile.alert { background: var(--alertbg); }

/* cards and sections */
.card { background: var(--surface); border-radius: 18px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.flush { padding: 6px 0; gap: 0; }
.sh { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sh h3 { font: 600 21px/1.1 var(--display); color: var(--deep); margin: 0; }
.sh .more { font: 600 12px var(--body); color: var(--plum); }
.card.flush .sh { padding: 10px 16px 6px; }

.row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--petal); text-align: left; width: 100%; min-width: 0; }
.row:first-of-type { border-top: 0; }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 600; color: var(--ink); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
.row .m { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .end { text-align: right; flex: none; }
.row .amt { font-weight: 600; color: var(--deep); font-variant-numeric: tabular-nums; }
.date { width: 44px; flex: none; text-align: center; border-radius: 10px; background: var(--petal); padding: 5px 0 4px; line-height: 1; }
.date b { display: block; font: 600 19px var(--display); color: var(--ink); }
.date span { font: 600 9px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.date.over { background: var(--alertbg); } .date.over b, .date.over span { color: var(--alert); }
.date.soon { background: var(--warnbg); } .date.soon b, .date.soon span { color: var(--warn); }

.pill { display: inline-flex; align-items: center; gap: 4px; font: 600 10.5px var(--body); padding: 3px 8px; border-radius: 99px; background: var(--okbg); color: var(--plum); white-space: nowrap; }
.pill.rose { background: var(--blush); color: var(--deep); }
.pill.red { background: var(--alertbg); color: var(--alert); }
.pill.warn { background: var(--warnbg); color: var(--warn); }
.pill.soft { background: var(--petal); color: var(--muted); }
.pill.done { background: var(--plum); color: #fff; }

/* doughnut */
.rsvp { display: grid; grid-template-columns: 128px 1fr; gap: 16px; align-items: center; }
.legend { display: grid; gap: 7px; }
.legend div { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend b { margin-left: auto; font-variant-numeric: tabular-nums; }

/* bars */
.bars { display: grid; gap: 10px; }
.bar3 .top3 { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; gap: 8px; }
.bar3 .top3 span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.track { position: relative; height: 10px; border-radius: 99px; background: var(--petal); overflow: hidden; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }

/* chips & segments */
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; margin: 0 -16px; padding-inline: 16px; }
.seg::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font: 600 12.5px var(--body); color: var(--plum); }
.chip[aria-pressed="true"] { background: var(--plum); border-color: var(--plum); color: #fff; }
.chip .n { opacity: .7; margin-left: 4px; font-weight: 500; }

.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
.search svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.search input { border: 0; outline: 0; background: none; font: inherit; padding: 11px 0; width: 100%; color: var(--ink); }

.check { width: 24px; height: 24px; border-radius: 50%; border: 1.6px solid var(--smauve); display: grid; place-items: center; flex: none; color: #fff; }
.check svg { width: 14px; height: 14px; opacity: 0; }
.check.on { background: var(--plum); border-color: var(--plum); }
.check.on svg { opacity: 1; }
.check.sq { border-radius: 7px; }
.row.isdone .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--smauve); }

.avatar { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 600 15px var(--display); color: var(--plum); background: var(--okbg); }
.avatar.b { background: var(--blush); color: var(--deep); }

.grp { font: 600 10.5px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--mauve); padding: 14px 16px 4px; }

.contact { display: flex; gap: 8px; }
.cbtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--petal); color: var(--deep); flex: none; }
.cbtn svg { width: 17px; height: 17px; }

.loose { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.loose div { background: var(--petal); border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; }
.loose b { font: 600 20px var(--display); color: var(--plum); }
.loose .hot b { color: var(--alert); }

.timeline { position: relative; padding: 8px 16px 8px 16px; }
.ev { display: grid; grid-template-columns: 62px 18px 1fr; gap: 8px; padding: 8px 0; }
.ev .tm { font: 600 12px var(--body); color: var(--deep); text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; }
.ev .ln { position: relative; }
.ev .ln::before { content: ""; position: absolute; left: 8px; top: 0; bottom: -16px; width: 1.5px; background: var(--blush); }
.ev:last-child .ln::before { display: none; }
.ev .ln i { position: absolute; left: 3px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--rose); }
.ev .a { font-weight: 600; }
.ev .o { font-size: 12px; color: var(--muted); }

.table-card { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.tcard { background: var(--surface); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
.tcard .h { display: flex; justify-content: space-between; align-items: baseline; }
.tcard .h b { font: 600 20px var(--display); color: var(--deep); }
.tcard .seats { display: flex; flex-wrap: wrap; gap: 3px; }
.tcard .seats i { width: 11px; height: 11px; border-radius: 50%; background: var(--petal); border: 1px solid var(--line); }
.tcard .seats i.f { background: var(--plum); border-color: var(--plum); }
.tcard .ml { font-size: 11px; color: var(--muted); }

.money-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.money-sum div { background: var(--petal); border-radius: 12px; padding: 10px; min-width: 0; }
.money-sum .l { font: 600 9.5px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.money-sum .v { font: 600 20px var(--display); color: var(--deep); font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 12px; font: 600 14px var(--body); background: var(--deep); color: #fff; text-decoration: none; }
.btn.alt { background: var(--surface); color: var(--plum); border: 1px solid var(--line); }
.btn.plum { background: var(--plum); }
.btn svg { width: 17px; height: 17px; }
.btn.sm { padding: 7px 12px; font-size: 12.5px; border-radius: 10px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.note { font-size: 12px; color: var(--muted); }
.proto svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.proto { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--plum); background: var(--okbg); border-radius: 12px; padding: 10px 12px; }

/* selection bar */
.selbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 24px); max-width: 436px; z-index: 9; background: var(--dplum); color: #fff; border-radius: 16px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 14px 30px -12px rgba(85,58,77,.6); }
@media (min-width: 520px) { .selbar { bottom: 104px; } }
.selbar .c { flex: 1; font-weight: 600; font-size: 13px; }
.selbar .btn { background: rgba(255,255,255,.14); padding: 9px 12px; font-size: 12.5px; }
.selbar .btn.w { background: #fff; color: var(--dplum); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(63,42,41,.38); z-index: 20; display: grid; align-items: end; justify-items: center; animation: fade .18s ease; }
.sheet { width: 100%; max-width: 460px; max-height: 88%; overflow-y: auto; background: var(--petal); border-radius: 24px 24px 0 0; padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; animation: up .22s ease; }
.sheet .grab { width: 40px; height: 4px; border-radius: 99px; background: var(--smauve); justify-self: center; }
.sheet .shead { position: sticky; top: -10px; z-index: 3; margin: -10px calc(-1 * max(18px, env(safe-area-inset-left, 0px))) -4px; padding: 10px max(18px, env(safe-area-inset-left, 0px)) 6px; background: var(--petal); display: flex; align-items: center; min-height: 32px; }
.sheet .shead .grab { position: absolute; left: 50%; top: 10px; margin-left: -20px; }
.sheet .sback { display: inline-flex; align-items: center; gap: 1px; height: 30px; max-width: 58%; padding: 0 12px 0 6px; margin-top: 8px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--plum); font: 600 13px var(--body); cursor: pointer; box-shadow: 0 1px 2px rgba(63,42,41,.05); }
.sheet .sback span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet .sback svg { flex: none; }
.sheet .sback:active { background: var(--blush); }
.sheet h4 { font: 600 26px/1.05 var(--display); color: var(--deep); margin: 0; text-wrap: balance; }
.sheet .lead { color: var(--muted); font-size: 13px; margin-top: -8px; }
.kv { background: var(--surface); border-radius: 14px; overflow: hidden; }
.kv div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--petal); font-size: 13.5px; }
.kv div:first-child { border-top: 0; }
.kv span { color: var(--muted); }
.kv b { font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.kv a { color: var(--plum); font-weight: 600; text-decoration: none; }
.sel { appearance: none; border: 1px solid var(--line); background: var(--petal); border-radius: 8px; padding: 5px 26px 5px 10px; font: 600 13px var(--body); color: var(--plum); background-image: linear-gradient(45deg, transparent 50%, var(--plum) 50%), linear-gradient(135deg, var(--plum) 50%, transparent 50%); background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bignum { font: 600 32px var(--display); color: var(--ink); text-align: center; letter-spacing: .02em; user-select: all; }
.callico { width: 64px; height: 64px; border-radius: 50%; background: var(--blush); color: var(--deep); display: grid; place-items: center; justify-self: center; }
.callico svg { width: 28px; height: 28px; }
textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; color: var(--ink); background: var(--surface); resize: vertical; min-height: 96px; }
.bubble { justify-self: end; max-width: 86%; background: var(--plum); color: #fff; padding: 10px 13px; border-radius: 18px 18px 4px 18px; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.phone { background: var(--surface); border-radius: 20px; padding: 14px; display: grid; gap: 8px; border: 1px solid var(--line); ; min-width: 0; }
.rsvp-page { background: var(--surface); border-radius: 18px; overflow: hidden; border: 1px solid var(--line); }
.rsvp-page .hd { background: var(--deep); color: #fff; padding: 18px; text-align: center; }
.rsvp-page .hd b { display: block; font: 600 24px var(--display); }
.rsvp-page .hd span { color: var(--blush); font-size: 12px; }
.rsvp-page .bd { padding: 14px; display: grid; gap: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 13px; animation: up .2s ease; max-width: calc(100% - 32px); }
@keyframes up { from { transform: translateY(16px); opacity: 0; } }
.toast { animation-name: upc; } @keyframes upc { from { transform: translate(-50%, 16px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); }
.qa { font-size: 13px; color: var(--ink); padding: 0 16px 12px 52px; margin-top: -4px; }
.qa .lab { font: 600 10px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--mauve); }
/* ---- v2 additions ---- */
/* polish pass */
.grp, .sect, .top .eyebrow, .qa .lab { color: var(--label); }
input, select, textarea { font-size: 16px !important; }
.sel { font-size: 15px !important; }
.btn, .chip, .tile, .tab, .iconbtn, .cbtn, .check, .switch, .donehead, .steps button { transition: transform .12s ease, background-color .15s ease, opacity .15s; -webkit-tap-highlight-color: transparent; }
.btn:active, .chip:active, .tile:active, .iconbtn:active, .cbtn:active, .steps button:active { transform: scale(.96); }
.tab:active { transform: scale(.92); }
button.row:active, .donehead:active { background: var(--petal); }
.cbtn { width: 40px; height: 40px; }
.check { position: relative; }
.check::after { content: ""; position: absolute; inset: -10px; }
main.enter { animation: enter .22s ease; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }
.sheet { transition: transform .22s ease; touch-action: pan-y; }

and arrange help for guests who need it",""],"Have you walked the full guest route (parking, ceremony, restrooms, reception) for steps and distance?":[3,"Walk the guest route with the venue","Walk it yourself from the parking lot: doors, steps, gravel, restrooms, distance."],"Which family photo groupings are must-haves?":[2,"Send the family photo list to the photographer","Write real names, not “bride’s family”. Order it so grandparents go first and can sit down."],"Is there a must-have shot list beyond the family groupings?":[2,"Send the must-have shot list to the photographer",""],"What is the meal service style?":[6,"Confirm the meal style and choices with the caterer","Plated is slowest but calmest. Buffets need one line per 50 guests."],"Any special dietary needs for the head table?":[1,"Send allergies and dietary needs to the caterer",""],"Do you have a rain backup plan for the ceremony?":[3,"Write the rain plan into the schedule","If you would be heartbroken by plan B, make plan B nicer now."],"Who makes the weather call, and by what time?":[1,"Set the weather-call time and who decides","Make the call early enough for rentals and florist to change setup, usually by mid-morning."],"Who is the day-of point of contact?":[2,"Give every vendor the day-of contact","It should not be either of you, or a parent."],"Who confirms vendor arrival times the week of?":[1,"Confirm vendor arrival times the week before",""],"Who is contributing to the budget, and are there any conditions?":[12,"Confirm contributions and any conditions in writing","Ask how much, when it arrives, and whether it comes with a say in decisions."],"Who mails the signed marriage license back to the county?":[1,"Confirm who files the marriage license","Most states give only a few days. Ask the officiant to send a photo once it is mailed."],"How many guests do you expect?":[9,"Finalize the guest list","Count on about 80 to 85 percent of invited guests saying yes."],"Are passports valid at least six mon e be a send-off?":[3,"Confirm the venue allows your send-off",""],"Is there an after-party?":[2,"Plan the after-party",""],"Signature cocktails?":[2,"Choose signature cocktails with the bartender",""],"When is last call?":[1,"Set last call with the bartender",""],"Will there be a late-night snack?":[2,"Order a late-night snack",""],"What is the cake flavor?":[4,"Choose cake flavors at a tasting",""],"Will there be a cake cutting, a dessert bar, or both?":[3,"Confirm cake and dessert plans with the baker",""],"Will you save the top tier of the cake?":[1,"Ask the baker to box the top tier",""],"What is the plan for leftover food and flowers?":[1,"Arrange containers and a home for leftovers",""],"Who has the emergency kit?":[1,"Pack the emergency kit","Safety pins, fashion tape, stain pen, sewing kit, pain relief, blister pads, phone chargers."],"How will you leave the reception and get to your hotel?":[2,"Book the getaway car",""],"Will there be a farewell brunch?":[2,"Plan the farewell brunch",""],"Who is preserving the dress and bouquet?":[1,"Arrange dress and bouquet preservation","The bouquet needs to reach the preserver within a day or two."],"Will you change your name?":[1,"List where your name needs changing","Social Security first, then license, passport, bank."],"How did you meet? (for the officiant and toasts)":[3,"Send your story to the officiant",""],"Are there inside jokes or stories to include?":[2,"Share stories with whoever is giving toasts",""],"Will there be surprise moments (gifts to parents, a special performance)?":[2,"Plan any surprise moments with the planner","Tell the planner and photographer, even if nobody else knows."],"Will you exchange letters or gifts with each other on the wedding day?":[1,"Write letters or buy gifts for each other",""],"Is there a family heirloom to include?":[2,"Arrange the family heirloom",""],"What is your wedding color palette?":[10,"Send color swatches to vendors",""],"What is the one moment you most want to remember?":[6,"Tell the photographer the moment you most want captured",""],"Is there anything you definitely do NOT want at your wedding?":[10,"Tell your vendors what you do not want",""],"What season and time of day feels right (for example afternoon garden or evening ballroom)?":[12,"Choose the season and time of day",""],"How many guests are coming from out of town?":[8,"Size the hotel block for out-of-town guests",""],"What is the dress code for guests?":[6,"Put the dress code on the website","Mention the ground underfoot (grass, sand, cobblestones) so guests choose shoes that work."],"Will there be a wedding website, and what should it include?":[8,"Build the wedding website",""],"How will guests RSVP (card, website, or both)?":[5,"Set up RSVPs","Number the back of each RSVP card to match your list. Someone always forgets to write their name."],"Does your officiant or church require counseling or paperwork?":[6,"Schedule officiant meetings or counseling",""],"What is the processional order?":[1,"Write out the processional order",""],"Will there be readings? Who is reading?":[3,"Choose readings and readers",""],"Are you writing your own vows?":[2,"Write your vows","Agree a rough length with each other so one is not three lines and the other three pages."],"Is there a ceremony or cultural tradition to include?":[4,"Plan the tradition with family",""],"Will you honor a family member who has passed away, and how?":[2,"Prepare the memorial tribute",""],"Who are the ushers, and who gets reserved seating?":[2,"Brief the ushers on reserved seating",""],"Will there be a first look?":[3,"Add the first look to the schedule","A first look lets you finish most photos before the ceremony and join your own cocktail hour."],"How many people are in the wedding party, and how will they be paired?":[9,"Ask your wedding party",""],"Who pays for wedding party attire and hair and makeup?":[9,"Tell the wedding party what they are paying for",""],"Where will the wedding party get ready?": ter dinner."],"Who is the backup if the planner is unavailable?":[2,"Name a backup for the planner",""],"Where are you willing to splurge, and where can you save?":[12,"Adjust the budget for splurges and savings",""],"Who approves spending over budget?":[12,"Agree who approves extra spending",""],"How much is set aside for emergencies?":[12,"Set aside an emergency fund","Five to ten percent of the budget is the usual cushion."],"Honeymoon plans?":[8,"Book the honeymoon","Consider leaving a day or two after the wedding, not the next morning."],"Is there a guest shuttle, or will guests drive and park?":[4,"Book guest transportation","Shuttles should leave the hotel 45 minutes before the ceremony, and run at least twice at the end."],"Who returns rentals and suits the next day?":[1,"Assign rental and suit returns",""],"When will thank-you cards go out, and who is tracking them?":[1,"Set a thank-you card plan","Write a few a day. Record each gift as cards are opened."],"When and where will you get the marriage license, and how long is it valid?":[2,"Book the marriage license appointment","Licenses expire (often in 30 to 90 days) and some counties have a waiting period. Too early or too late both cause problems."],"Who is the “license captain” who brings the license and gets it signed?":[1,"Give the license to the license captain at the rehearsal","On the day nobody remembers the license. One named person makes sure it is signed before the officiant leaves."],"Is your officiant legally able to marry you in this state?":[6,"Confirm the officiant’s credentials with the county clerk","A friend who gets ordained online still has to meet the county rules, and some counties ask for registration ahead of time."],"Do you want a prenuptial agreement, and when must it be signed?":[6,"Meet with an attorney about a prenup","A prenup signed in the last few weeks can be challenged. Attorneys usually want it finished at least a month before."],"How many certified copies of the marriage e has to pack decor, gifts, leftover alcohol and personal items inside the venue’s time limit."],"When are your fittings, and who is coming to learn the bustle?":[3,"Book fittings and bring the bustle helper to the last one","The person doing the bustle should see it done once. Film it on a phone at the final fitting."],"Have you booked hair and makeup trials?":[3,"Book the hair and makeup trial","Do the trial on the day of a shower or the engagement photos so it does double duty."],"Who steams and transports the dress, suits and bridesmaid dresses?":[1,"Arrange steaming for the morning of","Dresses wrinkle in the car. Decide who owns the steamer and when it happens."],"Do you have a second pair of shoes and a wrap or jacket for the evening?":[1,"Buy backup shoes and break in the wedding pair","New shoes for ten hours is the most common regret. Break them in at home and bring flats."],"When do the rings need to be sized, engraved and picked up?":[3,"Order and size the wedding bands","Engraving and sizing can take four to six weeks. Have them in hand two weeks before."],"What are the groom and groomsmen wearing, and when must rentals be ordered and collected?":[4,"Send suit measurements and set the pickup date","Out-of-town groomsmen need to send measurements early. Everyone tries the suit on at pickup, not on the day."],"Do you need two boutonnieres or a spare for photos?":[1,"Ask the florist for a spare boutonniere","Boutonnieres get crushed by hugs before the ceremony. A spare costs a few dollars."],"What will guests need for the weather (shade, fans, heaters, umbrellas, bug spray)?":[2,"Order weather comfort items for guests","A basket of fans or blankets costs little and is what guests remember about being looked after."],"Are there enough restrooms, and are they stocked?":[3,"Check restroom count and add a restroom basket","Plan about one restroom per 50 guests. A small basket with basics is a kind touch."],"How do guests who have been drinking get home safely? ist for the rehearsal","The rehearsal is the last calm moment to pass things to the people responsible."],"Will there be a shower, bachelor or bachelorette party, and who is planning each?":[6,"Share guest lists and dates with the party hosts","Give the hosts a guest list and two or three dates. Everyone invited to a shower should be invited to the wedding."],"What will you each do the morning of the wedding?":[1,"Order breakfast and lunch for both getting-ready rooms","Plan a real breakfast and something calm. Order food for both getting-ready rooms in advance."],"If the ceremony moves indoors, what exactly changes, and who tells the vendors and guests?":[2,"Write out the rain plan and send it to vendors","A rain plan is only real if the florist, musicians, rentals and photographer all know their part of it."],"Do outdoor vendors have the power they need, and is there a backup?":[3,"Confirm power needs with the venue and each vendor","Bands, DJs, lighting and caterers each need their own circuit. One tripped breaker stops the music."],"Who has a spare copy of the vows, readings, toasts and the timeline?":[1,"Print spare copies of vows, readings and timeline","Phones die and notes get left in hotel rooms. Printed spares with the coordinator fix it in seconds."],"Who is the emergency contact for each of you, and does the planner know any medical needs?":[1,"Share emergency contacts and medical notes with the planner","Allergies, medication and a named contact take one minute to share and matter a great deal if needed."],"What is the plan if a key person is late or cannot come (officiant, parent, wedding party)?":[1,"Name a stand-in for each key role","Decide the latest you will wait and who steps in. You will probably never use it."],"Where are the nearest pharmacy, urgent care and late-night store?":[1,"Add the nearest pharmacy and urgent care to Places","Someone will need safety pins, pain relief or a phone charger. Knowing where saves a search."],"Who holds your phones, keys, wallet and medication during the day?":[1,"Assign someone to hold personal items","Wedding clothes have no pockets. One person with one bag ends the question."],"How do you want the day to feel, in three words?":[12,"Share your three words with your vendors","Three words settle most small decisions later. If an idea does not fit them, drop it."],"How involved do you want each set of parents to be in decisions?":[12,"Talk with both families about who decides what","Deciding this together and early prevents most family friction, especially when parents are contributing."],"What is your A-list and B-list, and when do B-list invitations go out?":[8,"Split the guest list into first and second rounds","Send the first round ten weeks out with an early RSVP date so second-round guests still get a proper invitation."],"When do save-the-dates and invitations go out, and what is the RSVP deadline?":[8,"Set mailing dates for save-the-dates and invitations","Save-the-dates six to eight months out, invitations eight to ten weeks out, RSVP three to four weeks before."],"How will you chase people who have not replied, and who makes the calls?":[2,"Follow up with guests who have not replied","About one in five guests needs a reminder. Split the list by family and start the day after the deadline."],"Where are you registered, and how will guests find it?":[8,"Set up the registry and link it on the website","Registry details go on the website and by word of mouth, never on the invitation itself."],"Have you checked every invitation address, title and name spelling?":[5,"Collect and check mailing addresses","Returned invitations cost two weeks. Ask each family for one person to check their side."],"How long should the ceremony be, and what time does it really start?":[3,"Agree the ceremony length and start time with the officiant","Print a time 15 minutes before you plan to walk. Guests arrive late and it saves a rushed start."],"What music plays before, during and after the ceremony, and who cues it?":[3,"Choose ceremony music and name who cues it","You need four cues: guests seated, processional, bride’s entrance, recessional. Someone must be able to see the aisle."],"Will the officiant and readers use a microphone?":[2,"Arrange and test ceremony microphones","Outdoors, guests past the third row hear nothing without one. Test it before guests arrive."],"Where does everyone stand, and will the officiant step aside for the kiss?":[1,"Tell the officiant to step aside for the first kiss","Ask the officiant to step out of the frame before the kiss. It is the photo you will frame."],"Who seats the grandparents and parents, and who cues the wedding party to walk?":[1,"Assign someone to cue the processional","Without a person at the back sending people down the aisle, the spacing falls apart."],"Who hands out programs, and what happens to bouquets, rings and vows during the ceremony?":[1,"Assign bouquet, rings and vow-card duties","Decide who takes the bouquet and who has the vow cards so nobody is searching pockets."],"What do you expect from the wedding party (costs, events, duties), and have you told them?":[9,"Send the wedding party their dates, costs and duties","Tell people the costs and dates before they say yes. It keeps friendships intact."],"Will you give gifts to the wedding party and parents, and when?":[2,"Order wedding party and parent gifts","The rehearsal dinner is the natural moment. Personalized items need four to six weeks."],"Who looks after the flower girl and ring bearer before and during the ceremony?":[1,"Assign an adult to the flower girl and ring bearer","Small children need a familiar adult in the front row and a plan if they refuse to walk."],"Where will divorced or remarried parents sit and stand at the ceremony, and in what order are they announced?":[3,"Confirm ceremony seating with each parent","Settle this privately with each parent well ahead. Surprises on the day hurt."],"Who sits at the tables nearest the two of you?":[1,"Place family tables on the seating chart","Parents, grandparents and the wedding party closest. Put the loudest table near the dance floor and older guests away from speakers."],"How much time is set aside for family photos, and where will they be taken?":[2,"Share the family photo list and times with the photographer","Allow about three minutes per grouping. Ten groupings is 30 minutes, right after the ceremony while everyone is still there."],"Have you told family exactly when and where to be for photos?":[1,"Text family their photo time and place","The delay is always one missing uncle. Text each person their time and place the week of."],"What details should the photographer capture (invitation, rings, heirlooms, both sets of shoes)?":[1,"Pack a details box for the photographer","Put them all in one box in the getting-ready room so the photographer can start without you."],"When will you get your photos and video, and what rights do you have to print and share?":[6,"Confirm photo and video delivery dates","Six to twelve weeks is normal for photos, longer for film. Ask about a sneak peek within a week."],"What is the order of events at the reception, and what time is each one?":[2,"Build the reception order with the DJ","Do toasts and the first dance before or during dinner so older guests see them and the photographer is still there."],"What does the DJ or band need from the venue (space, table, power, load-in time)?":[2,"Send the venue the entertainment setup requirements","Bands often need two to three hours to set up and sound check before guests arrive."],"How will you keep the dance floor full?":[1,"Send the DJ your must-play list","Open dancing straight after a high-energy moment, keep the bar near the floor, and never close the bar during dancing."],"Who gives a welcome or blessing, and do speakers know their time limit?":[1,"Tell each speaker their time limit and order","Three minutes each is plenty. Ask to see toasts in advance if you nations or travel insurance for the honeymoon?":[4,"Check visas and book travel insurance","Book travel in the name on your passport. Change your name after you are home."],"Who looks after your home, pets, mail and gifts while you are away?":[1,"Arrange a house and pet sitter","Gifts and cards should not sit in a car or an empty house."],"Who collects personal items at the end of the night (guest book, cake knife, signs, photos, leftover favors)?":[1,"Give the end-of-night collection list to one person","Give one person a written list. Things left overnight are often gone by morning."],"Will you leave reviews and send thank-you notes or tips to vendors who went above and beyond?":[0,"Write vendor reviews and thank-you notes","A review is the most valuable thank-you a small vendor can get."],"How will you share photos with guests, and collect theirs?":[1,"Set up a shared photo album and print the QR code","A shared album link or QR code on the tables gathers photos you would never otherwise see."],"What family or cultural traditions matter to each side, and have you asked the grandparents?":[9,"Ask both families about traditions to include","Ask before you plan the ceremony. It is much harder to add something meaningful at the last minute."],"Is there a song, reading, recipe or object that would mean a lot to someone you love?":[4,"Choose one personal touch for each family","Small private nods (a grandmother’s recipe, a father’s song) are what families talk about afterwards."]}};

    <section class="card flush donecard"><button class="donehead" data-act="toggledone" aria-expanded="${UI.showDone}"><span class="check on">${I.check}</span>Completed<span class="badge">${doneL.length}</span><span class="chev">${I.chev}</span></button>${UI.showDone ? doneL.map(taskRow).join('') : ''}</section>`;

    <section class="card flush"><div class="sh"><h3>Budget Lines</h3></div>${S.budget.map(b => { const paid = paidFor(b.Category, b.Vendor), bal = (+b.Actual || 0) - paid; const st = (+b.Actual > 0 && paid >= +b.Actual) ? ['Paid', 'done'] : paid > 0 ? ['Partial', ''] : +b.Actual > 0 ? ['Not Paid', 'rose'] : ['Planned', 'soft']; return `<button class="row" data-row="budget:${S.budget.indexOf(b)}"><div class="main"><div class="t">${esc(b.Category)}</div><div class="m">${esc(b.Vendor || 'No vendor yet')}</div></div><div class="end"><div class="amt">${money(b.Actual || b.Budget)}</div><div class="m">${bal > 0 ? money(bal) + ' due' : ''}</div></div><span class="pill ${st[1]}">${st[0]}</span></button>`; }).join('')}</section>`;
  } else {

/* ---------- calendar (.ics) ---------- */
function exportIcs() {
  const esc2 = t => String(t || '').replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const ymd = s => s.replace(/-/g, ''), stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const nextDay = s => { const d = D(s); d.setDate(d.getDate() + 1); return iso(d); };
  const ev = [], add = (uid, s, title, desc, opts = {}) => {
    const lines = ['BEGIN:VEVENT', `UID:${uid}@weddingdesk`, `DTSTAMP:${stamp}`];
    if (opts.time) { const [h, m] = opts.time.split(':'); const st = ymd(s) + 'T' + h.padStart(2, '0') + m.padStart(2, '0') + '00'; lines.push(`DTSTART:${st}`, `DURATION:PT${opts.mins || 30}M`); }
    else lines.push(`DTSTART;VALUE=DATE:${ymd(s)}`, `DTEND;VALUE=DATE:${ymd(nextDay(s))}`);
    lines.push(`SUMMARY:${esc2(title)}`); if (desc) lines.push(`DESCRIPTION:${esc2(desc)}`); if (opts.loc) lines.push(`LOCATION:${esc2(opts.loc)}`);
    if (opts.alarm) lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${esc2(title)}`, `TRIGGER:${opts.alarm}`, 'END:VALARM');
    lines.push('END:VEVENT'); ev.push(lines.join('\r\n'));
  };
  const d = S.details, today = iso(TODAY); let n = { t: 0, p: 0, s: 0 };
  if (d.wd) add('wedding', d.wd, `💍 ${d.couple || 'Our'} Wedding`, [d.venue, d.city].filter(Boolean).join(', '), { time: d.time || '', mins: 360, loc: [d.venue, d.street, d.city].filter(Boolean).join(', '), alarm: '-P7D' });
  S.tasks.forEach((t, i) => { if (OPEN(t) && t['Due Date'] && t['Due Date'] >= today) { add('task' + i + '-' + t['Due Date'], t['Due Date'], `Wedding: ${t.Task}`, [t.Owner, t.Notes].filter(Boolean).join(' · '), { alarm: '-PT0M' }); n.t++; } });
  S.payments.forEach((p, i) => { if (p.Status !== 'Paid' && p['Due Date'] && p['Due Date'] >= today) { add('pay' + i + '-' + p['Due Date'], p['Due Date'], `Pay ${p.Vendor}: ${money(p.Amount)}`, [p.Payment, p.Category].filter(Boolean).join(' · '), { alarm: '-P3D' }); n.p++; } });
  S.planner.forEach((e, i) => { if (e.Date && e.Date >= today && e.Time) { add('evt' + i + '-' + e.Date, e.Date, e.Activity, [e['Day Of'], e.Owner, e.Notes].filter(Boolean).join(' · '), { time: e.Time, mins: 30 }); n.s++; } });
  if (!ev.length) return toast('Nothing upcoming to add yet');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//The Wedding Desk//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Wedding Desk', ...ev, 'END:VCALENDAR'].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar' }), url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'Wedding Desk dates.ics'; document.body.appendChild(a);
  try { a.click(); toast(`Calendar file ready: ${n.t} tasks, ${n.p} payments, ${n.s} schedule times`); } catch (e) { toast('Download isn\'t available in this preview'); }
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);

/* bring in someone else's changes; keep anything this phone changed that they didn't */
async function cloudPull(thenPush) {
  const { data: row, error } = await CLOUD.sb.from('wedding_state').select('*').eq('wedding_id', CLOUD.wid).single();
  if (error || !row) return;
  cloudMerge(row, thenPush);
}
function cloudMerge(row, thenPush) {
  if (row.version <= CLOUD.ver && !thenPush) return;
  const mine = cloudData(S), base = CLOUD.base || {}, theirs = row.data || {}, out = {};
  const changedHere = CLOUD.pending ? new Set(Object.keys({ ...mine, ...base }).filter(k => JSON.stringify(mine[k]) !== JSON.stringify(base[k]))) : new Set();
  for (const k of new Set([...Object.keys(theirs), ...Object.keys(mine)])) out[k] = changedHere.has(k) ? mine[k] : theirs[k];
  CLOUD.ver = row.version; CLOUD.base = theirs; applyRemote(out);
  const who = CLOUD.members.find(m => m.user_id === row.updated_by);

}
async function cloudMembers() {

  CLOUD.invites = [];

}
async function cloudEnter(m) {

  const { data: row, error } = await CLOUD.sb.from('wedding_state').select('*').eq('wedding_id', m.wedding_id).single();
  if (error || !row) return gateMsg('We couldn’t open your wedding. Check your connection and try again.');

    if (m.access !== 'viewer') { if (!S.own) startFresh(); S.role = m.role; CLOUD.base = {}; CLOUD.pending = true; await cloudPush(); }
  } else { CLOUD.base = row.data; applyRemote(row.data); }

const gVal = id => (document.getElementById(id)?.value || '').trim();
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-g]'); if (!b || !CLOUD.sb && b.dataset.g !== 'retry') return;

  if (g === 'retry') return location.reload();

  if (ds.act === 'invdel') return confirmBox('Cancel This Invite?', 'The code will stop working. You can make a new one any time.', 'Cancel Invite', async () => { const { error } = await CLOUD.sb.from('invites').delete().eq('code', ds.c); if (error) return toast(error.message); await cloudMembers(); toast('Invite cancelled'); });
  if (ds.act === 'myrole') return myRoleSheet();
  if (ds.act === 'setrole') { const { error } = await CLOUD.sb.from('members').update({ role: ds.v }).eq('wedding_id', CLOUD.wid).eq('user_id', CLOUD.user.id); if (error) return toast('Couldn’t change your role'); await cloudMembers(); S.role = ds.v; toast(`You’re now ${ROLE(ds.v)}`); return myRoleSheet(); }
  if (ds.act === 'signout') return confirmBox('Sign Out?', 'Your wedding stays saved. Sign in again any time with your email.', 'Sign Out', cloudSignOut);
}

/* let each sheet opener record itself so Back can reopen it */
for (const n of ["legalSheet", "inviteSheet", "memberSheet", "myRoleSheet", "rowForm", "tableSheet", "searchSheet", "callSheet", "dndSheet", "reachSheet", "contactSheet", "mapSheet", "composeSheet", "repliesSheet", "guestSheet", "guestForm", "vendorSheet", "vendorForm", "taskForm", "payForm", "settingsSheet", "helpSheet", "shareSheet", "importSheet"]) { const f = window[n]; if (typeof f !== 'function') continue; window[n] = function (...args) { SH_OPEN = (SH_OPEN && SH_OPEN.back && SH_OPEN.fn === n) ? SH_OPEN : { fn: n, args }; return f.apply(this, args); }; }
cloudInit();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(r => { r.update(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update(); }); }).catch(() => {});
}
</script>
