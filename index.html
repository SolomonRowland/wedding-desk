<style>
@font-face{font-family:'Cormorant';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/cormorant-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Cormorant';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/cormorant-latin-600-normal.woff2) format('woff2')}

@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}

<style>
/* Layout: a single phone-width app column on a blush ground; tab bar pinned to the bottom of the column.
   Palette and type come straight from The Wedding Desk workbook and user guide. One deliberate light look. */
:root {
  --ground: #F4E7E6;
  --surface: #FFFFFF;
  --petal: #F9EEED;
  --blush: #F2DCDB;
  --line: #E8D3D2;
  --rose: #D99694;
  --deep: #953735;
  --hdr: #A95450;
  --plum: #6E4B63;
  --dplum: #553A4D;
  --mauve: #A88BA0;
  --smauve: #C9B6C3;
  --ink: #3F2A29;
  --muted: #7A6260;
  --label: #7C5E74;
  --alert: #A6231F;
  --alertbg: #F8E1DF;
  --warn: #9A4A0A;
  --warnbg: #FBEBDD;
  --okbg: #EFE5EC;
  --display: "Cormorant", "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  color-scheme: light;
}
html, body { height: 100%; }
body { font-variant-numeric: lining-nums; background: var(--ground); color: var(--ink); font: 400 14px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: lining-nums tabular-nums; }
.tile .v, .loose b, .date b, .money-sum .v, .hero .count b, .tcard .h b { font-variant-numeric: lining-nums tabular-nums; }

.app { max-width: 460px; margin: 0 auto; min-height: 100%; background: var(--petal); position: relative; box-shadow: 0 0 0 1px var(--line), 0 30px 80px -40px rgba(85,58,77,.35); }
@media (min-width: 520px) { body { padding-block: 24px; } .app { border-radius: 28px; overflow: hidden; min-height: calc(100% - 48px); } }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--petal); padding: 14px max(18px, env(safe-area-inset-right, 0px)) 10px max(18px, env(safe-area-inset-left, 0px)); display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 1px solid transparent; transition: border-color .2s; }
.top.scrolled { border-bottom-color: var(--line); }
.top h1 { font: 600 30px/1 var(--display); color: var(--deep); margin: 0; letter-spacing: -.01em; }
.top .eyebrow { font: 600 10.5px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--mauve); margin-bottom: 4px; }
.top .act { display: flex; gap: 8px; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--plum); }
.iconbtn svg { width: 18px; height: 18px; }

main { padding: 4px max(16px, env(safe-area-inset-right, 0px)) 110px max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

/* bottom tabs */
.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 460px; z-index: 8; background: rgba(255,255,255,.94); backdrop-filter: blur(12px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
@media (min-width: 520px) { .tabs { bottom: 24px; border-radius: 0 0 28px 28px; } }
.tab { display: grid; justify-items: center; gap: 3px; padding: 6px 0 2px; font: 500 10.5px var(--body); color: var(--muted); border-radius: 12px; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--deep); }
.tab[aria-current="page"] .dot { background: var(--deep); }
.tab .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }

/* hero */
.hero { background: var(--deep); color: #fff; border-radius: 22px; padding: 20px 20px 18px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; border: 1.5px solid rgba(242,220,219,.25); box-shadow: 46px 26px 0 -1.5px rgba(242,220,219,0), 46px 26px 0 0 rgba(242,220,219,.18); }
.hero .k { font: 600 10.5px var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--blush); }
.hero h2 { font: 600 28px/1.05 var(--display); margin: 6px 0 4px; text-wrap: balance; }
.hero .sub { color: var(--blush); font-size: 12.5px; }
.hero .count { display: flex; align-items: baseline; gap: 8px; margin-top: 16px; }
.hero .count b { font: 600 54px/0.9 var(--display); }
.hero .count span { font-size: 13px; color: var(--blush); }
.tl { margin-top: 14px; }
.tl .bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
.tl .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--rose), #F6D4D2); }
.tl .lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--blush); margin-top: 6px; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border-radius: var(--r); padding: 11px 11px 10px; border-top: 3px solid var(--c, var(--plum)); text-align: left; display: grid; gap: 2px; min-width: 0; }
.tile .l { font: 600 9.5px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.tile .v { font: 600 30px/1 var(--display); color: var(--c); }
.tile .s { font-size: 10.5px; color: var(--muted); line-height: 1.3; }
.tile.alert { background: var(--alertbg); }

/* cards and sections */
.card { background: var(--surface); border-radius: 18px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.flush { padding: 6px 0; gap: 0; }
.sh { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sh h3 { font: 600 21px/1.1 var(--display); color: var(--deep); margin: 0; }
.sh .more { font: 600 12px var(--body); color: var(--plum); }
.card.flush .sh { padding: 10px 16px 6px; }

.row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--petal); text-align: left; width: 100%; min-width: 0; }
.row:first-of-type { border-top: 0; }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 600; color: var(--ink); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
.row .m { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .end { text-align: right; flex: none; }
.row .amt { font-weight: 600; color: var(--deep); font-variant-numeric: tabular-nums; }
.date { width: 44px; flex: none; text-align: center; border-radius: 10px; background: var(--petal); padding: 5px 0 4px; line-height: 1; }
.date b { display: block; font: 600 19px var(--display); color: var(--ink); }
.date span { font: 600 9px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.date.over { background: var(--alertbg); } .date.over b, .date.over span { color: var(--alert); }
.date.soon { background: var(--warnbg); } .date.soon b, .date.soon span { color: var(--warn); }

.pill { display: inline-flex; align-items: center; gap: 4px; font: 600 10.5px var(--body); padding: 3px 8px; border-radius: 99px; background: var(--okbg); color: var(--plum); white-space: nowrap; }
.pill.rose { background: var(--blush); color: var(--deep); }
.pill.red { background: var(--alertbg); color: var(--alert); }
.pill.warn { background: var(--warnbg); color: var(--warn); }
.pill.soft { background: var(--petal); color: var(--muted); }
.pill.done { background: var(--plum); color: #fff; }

/* doughnut */
.rsvp { display: grid; grid-template-columns: 128px 1fr; gap: 16px; align-items: center; }
.legend { display: grid; gap: 7px; }
.legend div { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend b { margin-left: auto; font-variant-numeric: tabular-nums; }

/* bars */
.bars { display: grid; gap: 10px; }
.bar3 .top3 { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; gap: 8px; }
.bar3 .top3 span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.track { position: relative; height: 10px; border-radius: 99px; background: var(--petal); overflow: hidden; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }

/* chips & segments */
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; margin: 0 -16px; padding-inline: 16px; }
.seg::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font: 600 12.5px var(--body); color: var(--plum); }
.chip[aria-pressed="true"] { background: var(--plum); border-color: var(--plum); color: #fff; }
.chip .n { opacity: .7; margin-left: 4px; font-weight: 500; }

.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
.search svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.search input { border: 0; outline: 0; background: none; font: inherit; padding: 11px 0; width: 100%; color: var(--ink); }

.check { width: 24px; height: 24px; border-radius: 50%; border: 1.6px solid var(--smauve); display: grid; place-items: center; flex: none; color: #fff; }
.check svg { width: 14px; height: 14px; opacity: 0; }
.check.on { background: var(--plum); border-color: var(--plum); }
.check.on svg { opacity: 1; }
.check.sq { border-radius: 7px; }
.row.isdone .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--smauve); }

.avatar { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 600 15px var(--display); color: var(--plum); background: var(--okbg); }
.avatar.b { background: var(--blush); color: var(--deep); }

.grp { font: 600 10.5px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--mauve); padding: 14px 16px 4px; }

.contact { display: flex; gap: 8px; }
.cbtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--petal); color: var(--deep); flex: none; }
.cbtn svg { width: 17px; height: 17px; }

.loose { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.loose div { background: var(--petal); border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; }
.loose b { font: 600 20px var(--display); color: var(--plum); }
.loose .hot b { color: var(--alert); }

.timeline { position: relative; padding: 8px 16px 8px 16px; }
.ev { display: grid; grid-template-columns: 62px 18px 1fr; gap: 8px; padding: 8px 0; }
.ev .tm { font: 600 12px var(--body); color: var(--deep); text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; }
.ev .ln { position: relative; }
.ev .ln::before { content: ""; position: absolute; left: 8px; top: 0; bottom: -16px; width: 1.5px; background: var(--blush); }
.ev:last-child .ln::before { display: none; }
.ev .ln i { position: absolute; left: 3px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--rose); }
.ev .a { font-weight: 600; }
.ev .o { font-size: 12px; color: var(--muted); }

.table-card { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.tcard { background: var(--surface); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
.tcard .h { display: flex; justify-content: space-between; align-items: baseline; }
.tcard .h b { font: 600 20px var(--display); color: var(--deep); }
.tcard .seats { display: flex; flex-wrap: wrap; gap: 3px; }
.tcard .seats i { width: 11px; height: 11px; border-radius: 50%; background: var(--petal); border: 1px solid var(--line); }
.tcard .seats i.f { background: var(--plum); border-color: var(--plum); }
.tcard .ml { font-size: 11px; color: var(--muted); }

.money-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.money-sum div { background: var(--petal); border-radius: 12px; padding: 10px; min-width: 0; }
.money-sum .l { font: 600 9.5px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.money-sum .v { font: 600 20px var(--display); color: var(--deep); font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 12px; font: 600 14px var(--body); background: var(--deep); color: #fff; text-decoration: none; }
.btn.alt { background: var(--surface); color: var(--plum); border: 1px solid var(--line); }
.btn.plum { background: var(--plum); }
.btn svg { width: 17px; height: 17px; }
.btn.sm { padding: 7px 12px; font-size: 12.5px; border-radius: 10px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.note { font-size: 12px; color: var(--muted); }
.proto svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.proto { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--plum); background: var(--okbg); border-radius: 12px; padding: 10px 12px; }

/* selection bar */
.selbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 24px); max-width: 436px; z-index: 9; background: var(--dplum); color: #fff; border-radius: 16px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 14px 30px -12px rgba(85,58,77,.6); }
@media (min-width: 520px) { .selbar { bottom: 104px; } }
.selbar .c { flex: 1; font-weight: 600; font-size: 13px; }
.selbar .btn { background: rgba(255,255,255,.14); padding: 9px 12px; font-size: 12.5px; }
.selbar .btn.w { background: #fff; color: var(--dplum); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(63,42,41,.38); z-index: 20; display: grid; align-items: end; justify-items: center; animation: fade .18s ease; }
.sheet { width: 100%; max-width: 460px; max-height: 88%; overflow-y: auto; background: var(--petal); border-radius: 24px 24px 0 0; padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; animation: up .22s ease; }
.sheet .grab { width: 40px; height: 4px; border-radius: 99px; background: var(--smauve); justify-self: center; }
.sheet h4 { font: 600 26px/1.05 var(--display); color: var(--deep); margin: 0; text-wrap: balance; }
.sheet .lead { color: var(--muted); font-size: 13px; margin-top: -8px; }
.kv { background: var(--surface); border-radius: 14px; overflow: hidden; }
.kv div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--petal); font-size: 13.5px; }
.kv div:first-child { border-top: 0; }
.kv span { color: var(--muted); }
.kv b { font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.kv a { color: var(--plum); font-weight: 600; text-decoration: none; }
.sel { appearance: none; border: 1px solid var(--line); background: var(--petal); border-radius: 8px; padding: 5px 26px 5px 10px; font: 600 13px var(--body); color: var(--plum); background-image: linear-gradient(45deg, transparent 50%, var(--plum) 50%), linear-gradient(135deg, var(--plum) 50%, transparent 50%); background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bignum { font: 600 32px var(--display); color: var(--ink); text-align: center; letter-spacing: .02em; user-select: all; }
.callico { width: 64px; height: 64px; border-radius: 50%; background: var(--blush); color: var(--deep); display: grid; place-items: center; justify-self: center; }
.callico svg { width: 28px; height: 28px; }
textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; color: var(--ink); background: var(--surface); resize: vertical; min-height: 96px; }
.bubble { justify-self: end; max-width: 86%; background: var(--plum); color: #fff; padding: 10px 13px; border-radius: 18px 18px 4px 18px; font-size: 13.5px; white-space: pre-wrap; }
.phone { background: var(--surface); border-radius: 20px; padding: 14px; display: grid; gap: 8px; border: 1px solid var(--line); }
.rsvp-page { background: var(--surface); border-radius: 18px; overflow: hidden; border: 1px solid var(--line); }
.rsvp-page .hd { background: var(--deep); color: #fff; padding: 18px; text-align: center; }
.rsvp-page .hd b { display: block; font: 600 24px var(--display); }
.rsvp-page .hd span { color: var(--blush); font-size: 12px; }
.rsvp-page .bd { padding: 14px; display: grid; gap: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 13px; animation: up .2s ease; max-width: calc(100% - 32px); }
@keyframes up { from { transform: translateY(16px); opacity: 0; } }
.toast { animation-name: upc; } @keyframes upc { from { transform: translate(-50%, 16px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); }
.qa { font-size: 13px; color: var(--ink); padding: 0 16px 12px 52px; margin-top: -4px; }
.qa .lab { font: 600 10px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--mauve); }
/* ---- v2 additions ---- */
/* polish pass */
.grp, .sect, .top .eyebrow, .qa .lab { color: var(--label); }
input, select, textarea { font-size: 16px !important; }
.sel { font-size: 15px !important; }
.btn, .chip, .tile, .tab, .iconbtn, .cbtn, .check, .switch, .donehead, .steps button { transition: transform .12s ease, background-color .15s ease, opacity .15s; -webkit-tap-highlight-color: transparent; }
.btn:active, .chip:active, .tile:active, .iconbtn:active, .cbtn:active, .steps button:active { transform: scale(.96); }
.tab:active { transform: scale(.92); }
button.row:active, .donehead:active { background: var(--petal); }
.cbtn { width: 40px; height: 40px; }
.check { position: relative; }
.check::after { content: ""; position: absolute; inset: -10px; }
main.enter { animation: enter .22s ease; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }
.sheet { transition: transform .22s ease; touch-action: pan-y; }
.sheet.dragging { transition: none; }
button:disabled { opacity: .45; }
::selection { background: var(--blush); }
.card.flush:not(.donecard):not(:has(.row)):not(:has(.ev)):not(:has(.empty))::after { content: "Nothing here yet."; display: block; padding: 22px 16px; text-align: center; color: var(--muted); }
.tile .v, .money-sum .v, .hero .count b, .loose b, .date b, .tcard .h b { font-family: var(--body) !important; font-weight: 600 !important; letter-spacing: -.02em; }
.tile .v { font-size: 25px !important; }
.hero .count b { font-size: 46px !important; letter-spacing: -.03em; }
.money-sum .v { font-size: 17px !important; }
.loose b { font-size: 17px !important; }
.date b { font-size: 16px !important; }
.tcard .h b { font-family: var(--display) !important; font-size: 20px !important; letter-spacing: 0; }

const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const D = s => { if (!s) return null; const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const isoPlus = n => { const d = new Date(TODAY); d.setDate(d.getDate() + n); return iso(d); };
const days = s => Math.round((D(s) - TODAY) / 864e5);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD = s => { const d = D(s); return d ? `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}` : ''; };
const longD = s => { const d = D(s); return d ? d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) : ''; };
const money = n => '$' + Math.round(+n || 0).toLocaleString('en-US');
const time12 = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = n => String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const OPEN = t => t.Status !== 'Completed' && t.Status !== 'Cancelled';
const BOOKED = ['Contract Signed', 'Deposit Paid', 'Confirmed'];
const GROUPS = [
  ['Venue & Rentals', ['Venue','Ceremony','Reception','Rentals','Linens','Tables & Chairs','Dance Floor','Lighting','Cleanup','Security','Valet']],
  ['Food & Drink', ['Catering','Bar & Beverages','Cake & Desserts','Cocktail Hour','Vendor Meals','Rehearsal Dinner','Brunch / Farewell Breakfast','After Party','Hotel Welcome Event']],
  ['Photo & Video', ['Photography','Videography','Photo Booth']],
  ['Music', ['DJ','Live Band','Music & Entertainment','Ceremony Music','Reception Music']],
  ['Flowers & Decor', ['Flowers','Decor','Signage','Guest Book','Guest Favors','Welcome Bags']],
  ['Attire & Beauty', ['Bride Attire','Groom Attire','Wedding Party Attire','Hair','Makeup','Jewelry','Accessories','Ring Purchase','Alterations']],
  ['Stationery', ['Invitations','Save The Dates','Stationery','Postage','Wedding Website','Thank You Cards']],
  ['Planning & Fees', ['Wedding Planner','Day Of Coordinator','Officiant','Marriage License','Taxes & Fees','Vendor Tips','Insurance']],
  ['Travel', ['Transportation','Lodging','Hotel Blocks','Honeymoon']],
];
const groupOf = c => (GROUPS.find(g => g[1].includes(c)) || ['Gifts & Other'])[0];
const paidFor = (cat, ven) => S.payments.filter(p => p.Status === 'Paid' && p.Category === cat && p.Vendor === ven).reduce((a, p) => a + (+p.Amount || 0), 0);
const paidVendor = ven => S.payments.filter(p => p.Status === 'Paid' && p.Vendor === ven).reduce((a, p) => a + (+p.Amount || 0), 0);

const QCAT = { 'Vision & Priorities': 'Other', 'Guests & Invitations': 'Guests & RSVP', 'Ceremony': 'Ceremony', 'Wedding Party': 'Wedding Party', 'Family & Seating': 'Seating Chart', 'Photos & Video': 'Photography', 'Reception & Entertainment': 'Reception', 'Food & Drink': 'Catering & Bar', 'Venue, Weather & Rules': 'Venue', 'Vendors & Day-Of Logistics': 'Day Of Operations', 'Budget & Payments': 'Budget & Finance', 'Travel & Honeymoon': 'Honeymoon', 'After the Wedding': 'Post-Wedding', 'Personal Touches': 'Other' };
function addTask(o) { const t = { Category: 'Other', Task: '', Owner: 'Couple', 'Due Date': isoPlus(14), Priority: 'Medium', Status: 'Not Started', Notes: '', ...o }; S.tasks.push(t); return t; }

function setQStatus(i, v) {

  }

function guestChanged(p, field) {

function stats() {
  const P = S.people, T = S.tasks;
  const acc = P.filter(p => p.RSVP === 'Accepted').length, inv = P.filter(p => p.RSVP === 'Invited').length,
    dec = P.filter(p => p.RSVP === 'Declined').length, wait = P.filter(p => p.RSVP === 'Waitlist').length;
  const budget = S.budget.reduce((a, b) => a + (+b.Budget || 0), 0), actual = S.budget.reduce((a, b) => a + (+b.Actual || 0), 0);
  const paid = S.payments.filter(p => p.Status === 'Paid').reduce((a, p) => a + (+p.Amount || 0), 0);
  const owed = S.payments.filter(p => p.Status !== 'Paid').reduce((a, p) => a + (+p.Amount || 0), 0);
  const active = S.vendors.filter(v => v['Vendor Status'] !== 'Cancelled').length, booked = S.vendors.filter(v => BOOKED.includes(v['Vendor Status'])).length;
  const counted = T.filter(t => t.Status !== 'Cancelled').length, done = T.filter(t => t.Status === 'Completed').length;
  const over = T.filter(t => OPEN(t) && t['Due Date'] && days(t['Due Date']) < 0).length;
  const soon = T.filter(t => OPEN(t) && ['High', 'Urgent'].includes(t.Priority) && t['Due Date'] && days(t['Due Date']) >= 0 && days(t['Due Date']) <= 30).length;
  const risk = S.risks.filter(r => r.Impact === 'High' && r.Probability === 'High' && r.Status === 'Open').length;
  const eng = D(S.details.eng), wd = D(S.details.wd);
  const pct = eng && wd && wd > eng ? Math.max(0, Math.min(1, (TODAY - eng) / (wd - eng))) : 0;
  return { acc, inv, dec, wait, total: P.length, budget, actual, paid, owed, active, booked, counted, done, over, soon, risk, attention: over + soon + risk, pct, togo: Math.max(0, days(S.details.wd)) };
}

function donut(parts, size = 128, w = 18) {
  const tot = parts.reduce((a, p) => a + p[0], 0) || 1, r = (size - w) / 2, c = 2 * Math.PI * r; let off = 0;
  const segs = parts.map(([v, col]) => { const len = v / tot * c; const s = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-dasharray="${Math.max(0, len - 2)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size / 2} ${size / 2})"/>`; off += len; return s; }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="RSVP breakdown"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--petal)" stroke-width="${w}"/>${segs}</svg>`;
}
function dateChip(s) {
  const d = D(s); if (!d) return '<div class="date"><b>–</b><span>no date</span></div>';
  const n = days(s); const cls = n < 0 ? 'over' : n <= 14 ? 'soon' : '';
  return `<div class="date ${cls}"><b>${d.getDate()}</b><span>${MON[d.getMonth()]}</span></div>`;
}
function dueText(s) { const n = days(s); if (n === null || isNaN(n)) return ''; if (n < 0) return `<span class="pill red">${-n}d overdue</span>`; if (n === 0) return '<span class="pill warn">today</span>'; if (n <= 14) return `<span class="pill warn">in ${n}d</span>`; return `<span class="pill soft">in ${n}d</span>`; }

  <div class="note">${money(s.budget - s.actual)} still available · ${money(s.owed)} scheduled to pay</div><div class="note"><b style="color:var(--ink)">Booked</b> is what you've agreed to pay vendors. <b style="color:var(--ink)">Paid</b> is money already sent.</div></section>`;

    <section class="card flush"><div class="sh"><h3>Budget lines</h3></div>${S.budget.map(b => { const paid = paidFor(b.Category, b.Vendor), bal = (+b.Actual || 0) - paid; const st = (+b.Actual > 0 && paid >= +b.Actual) ? ['Paid', 'done'] : paid > 0 ? ['Partial', ''] : +b.Actual > 0 ? ['Not paid', 'rose'] : ['Planned', 'soft']; return `<div class="row"><div class="main"><div class="t">${esc(b.Category)}</div><div class="m">${esc(b.Vendor || 'No vendor yet')}</div></div><div class="end"><div class="amt">${money(b.Actual || b.Budget)}</div><div class="m">${bal > 0 ? money(bal) + ' due' : ''}</div></div><span class="pill ${st[1]}">${st[0]}</span></div>`; }).join('')}</section>`;
  } else {
    const up = S.payments.map((p, i) => [p, i]).filter(([p]) => p.Status !== 'Paid').sort((a, b) => (a[0]['Due Date'] || '9').localeCompare(b[0]['Due Date'] || '9'));
    const done = S.payments.map((p, i) => [p, i]).filter(([p]) => p.Status === 'Paid').sort((a, b) => (b[0]['Paid On'] || '').localeCompare(a[0]['Paid On'] || ''));
    body = sum + `<div class="toolbar"><button class="btn alt sm" data-act="share" data-kind="payments">${I.share} Share or print payments</button></div><section class="card flush"><div class="sh"><h3>Scheduled</h3><span class="note">${money(s.owed)}</span></div>${up.map(([p, i]) => `<div class="row">${dateChip(p['Due Date'])}<div class="main"><div class="t">${esc(p.Vendor)}</div><div class="m">${esc(p.Payment)} · ${esc(p.Category)}</div></div><div class="end"><div class="amt">${money(p.Amount)}</div><button class="btn sm alt" data-pay="${i}" style="margin-top:4px">Mark paid</button></div></div>`).join('') || '<div class="empty">Everything is paid.</div>'}</section>
    <section class="card flush"><div class="sh"><h3>Paid</h3><span class="note">${money(s.paid)}</span></div>${done.map(([p]) => `<div class="row"><div class="check on">${I.check}</div><div class="main"><div class="t">${esc(p.Vendor)}</div><div class="m">${esc(p.Payment)} · paid ${fmtD(p['Paid On'] || p['Due Date'])}</div></div><div class="amt">${money(p.Amount)}</div></div>`).join('')}</section>`;

/* ---------- sheets ---------- */
const layer = document.getElementById('layer');
function sheet(html) { layer.innerHTML = `<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc((html.match(/<h4[^>]*>([^<]*)/) || [])[1] || 'Details')}"><div class="grab"></div>${html}</div></div>`; const sh = layer.querySelector('.sheet'); sh.tabIndex = -1; sh.focus({ preventScroll: true }); sh.scrollTop = 0; }
let drag = null;
layer.addEventListener('touchstart', e => { const sh = e.target.closest('.sheet'); if (!sh || sh.scrollTop > 0 || e.target.closest('input,textarea,select,video')) return; drag = { sh, y: e.touches[0].clientY, dy: 0 }; }, { passive: true });
layer.addEventListener('touchmove', e => { if (!drag) return; drag.dy = Math.max(0, e.touches[0].clientY - drag.y); if (drag.dy > 4) { drag.sh.classList.add('dragging'); drag.sh.style.transform = `translateY(${drag.dy}px)`; } }, { passive: true });
layer.addEventListener('touchend', () => { if (!drag) return; const { sh, dy } = drag; drag = null; sh.classList.remove('dragging'); if (dy > 110) { sh.style.transform = 'translateY(100%)'; setTimeout(closeSheet, 180); } else sh.style.transform = ''; });
function closeSheet() { stopVideo(); layer.innerHTML = ''; }
function toast(msg, action) { document.querySelectorAll('.toast').forEach(x => x.remove()); const t = document.createElement('div'); t.className = 'toast' + (layer.innerHTML ? ' up' : ''); t.setAttribute('role', 'status'); const sp = document.createElement('span'); sp.textContent = msg; t.appendChild(sp);
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { t.remove(); action.fn(); }; t.appendChild(b); }
  document.body.appendChild(t); setTimeout(() => t.remove(), action ? 4500 : 2400); }
async function copy(text, label) { try { await navigator.clipboard.writeText(text); toast(label + ' copied'); } catch (e) { toast('Select the text to copy it'); } }

function buildSpec() {

    const order = Object.keys(g).sort((a, b) => (a === 'Overdue' ? -1 : b === 'Overdue' ? 1 : a === 'Completed' ? 1 : b === 'Completed' ? -1 : 0));

  }
  if (k === 'dayof') {

  if (ds.qs) return setQStatus(+ds.qs, t.value);
  if (ds.qans) { S.questions[+ds.qans].Answer = t.value; save(); return toast('Answer saved'); }
  if (ds.vs) { const v = S.vendors[+ds.vs]; v['Vendor Status'] = t.value; vendorChanged(v); save(); render(); return; }
  if (!ds.edit) return;
  const p = S.people[+ds.edit]; p[ds.field] = ds.field === 'Table' ? (t.value ? +t.value : '') : t.value; guestChanged(p, ds.field); save(); render();
});
document.addEventListener('input', e => { if (e.target.id === 'q') { UI.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
function fromHash() { const h = location.hash.slice(1); UI.tab = TABS.some(t => t[0] === h) ? h : 'home'; render(); }
addEventListener('hashchange', fromHash);
fromHash();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(r => { r.update(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update(); }); }).catch(() => {});
}
</script>
