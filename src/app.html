<title>The Wedding Desk App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#953735">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single phone-width app column on a blush ground; tab bar pinned to the bottom of the column.
   Palette and type come straight from The Wedding Desk workbook and user guide. One deliberate light look. */
:root {
  --ground: #F6ECEB;
  --surface: #FFFFFF;
  --petal: #FBF3F2;
  --blush: #F2DCDB;
  --line: #EEDCDB;
  --rose: #D99694;
  --deep: #953735;
  --hdr: #A95450;
  --plum: #93566A;
  --dplum: #74485A;
  --mauve: #C39AA6;
  --smauve: #E3CCD2;
  --ink: #3F2A29;
  --muted: #7A6260;
  --label: #93566A;
  --alert: #A6231F;
  --alertbg: #F8E1DF;
  --warn: #9A4A0A;
  --warnbg: #FBEBDD;
  --okbg: #F7E6EA;
  --display: "Cormorant", "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  color-scheme: light;
}
html, body { height: 100%; }
body { font-variant-numeric: lining-nums; background: var(--ground); color: var(--ink); font: 400 14px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: lining-nums tabular-nums; }
.tile .v, .loose b, .date b, .money-sum .v, .hero .count b, .tcard .h b { font-variant-numeric: lining-nums tabular-nums; }

.app { max-width: 460px; margin: 0 auto; min-height: 100%; background: var(--petal); position: relative; box-shadow: 0 0 0 1px var(--line), 0 30px 80px -40px rgba(85,58,77,.35); }
@media (min-width: 520px) { body { padding-block: 24px; } .app { border-radius: 28px; overflow: hidden; min-height: calc(100% - 48px); } }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--petal); padding: 14px max(18px, env(safe-area-inset-right, 0px)) 10px max(18px, env(safe-area-inset-left, 0px)); display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 1px solid transparent; transition: border-color .2s; }
.top.scrolled { border-bottom-color: var(--line); }
.top h1 { font: 600 30px/1 var(--display); color: var(--deep); margin: 0; letter-spacing: -.01em; }
.top .eyebrow { font: 600 10.5px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--mauve); margin-bottom: 4px; }
.top .act { display: flex; gap: 8px; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--plum); }
.iconbtn svg { width: 18px; height: 18px; }

main { padding: 4px max(16px, env(safe-area-inset-right, 0px)) 110px max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

/* bottom tabs */
.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 460px; z-index: 8; background: rgba(255,255,255,.94); backdrop-filter: blur(12px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
@media (min-width: 520px) { .tabs { bottom: 0; border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: 0; box-shadow: 0 -8px 24px -18px rgba(149,55,53,.35); } }
.tab { display: grid; justify-items: center; gap: 3px; padding: 6px 0 2px; font: 500 10.5px var(--body); color: var(--muted); border-radius: 12px; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--deep); }
.tab[aria-current="page"] .dot { background: var(--deep); }
.tab .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }

/* hero */
.hero { background: var(--deep); color: #fff; border-radius: 22px; padding: 20px 20px 18px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; border: 1.5px solid rgba(242,220,219,.25); box-shadow: 46px 26px 0 -1.5px rgba(242,220,219,0), 46px 26px 0 0 rgba(242,220,219,.18); }
.hero .k { font: 600 10.5px var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--blush); }
.hero h2 { font: 600 28px/1.05 var(--display); margin: 6px 0 4px; text-wrap: balance; }
.hero .sub { color: var(--blush); font-size: 12.5px; }
.hero .count { display: flex; align-items: baseline; gap: 8px; margin-top: 16px; }
.hero .count b { font: 600 54px/0.9 var(--display); }
.hero .count span { font-size: 13px; color: var(--blush); }
.tl { margin-top: 14px; }
.tl .bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
.tl .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--rose), #F6D4D2); }
.tl .lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--blush); margin-top: 6px; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border-radius: var(--r); padding: 11px 11px 10px; border-top: 3px solid var(--c, var(--plum)); text-align: left; display: grid; gap: 2px; min-width: 0; }
.tile .l { font: 600 9.5px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.tile .v { font: 600 30px/1 var(--display); color: var(--c); }
.tile .s { font-size: 10.5px; color: var(--muted); line-height: 1.3; }
.tile.alert { background: var(--alertbg); }

/* cards and sections */
.card { background: var(--surface); border-radius: 18px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.flush { padding: 6px 0; gap: 0; }
.sh { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sh h3 { font: 600 21px/1.1 var(--display); color: var(--deep); margin: 0; }
.sh .more { font: 600 12px var(--body); color: var(--plum); }
.card.flush .sh { padding: 10px 16px 6px; }

.row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--petal); text-align: left; width: 100%; min-width: 0; }
.row:first-of-type { border-top: 0; }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 600; color: var(--ink); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
.row .m { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .end { text-align: right; flex: none; }
.row .amt { font-weight: 600; color: var(--deep); font-variant-numeric: tabular-nums; }
.date { width: 44px; flex: none; text-align: center; border-radius: 10px; background: var(--petal); padding: 5px 0 4px; line-height: 1; }
.date b { display: block; font: 600 19px var(--display); color: var(--ink); }
.date span { font: 600 9px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.date.over { background: var(--alertbg); } .date.over b, .date.over span { color: var(--alert); }
.date.soon { background: var(--warnbg); } .date.soon b, .date.soon span { color: var(--warn); }

.pill { display: inline-flex; align-items: center; gap: 4px; font: 600 10.5px var(--body); padding: 3px 8px; border-radius: 99px; background: var(--okbg); color: var(--plum); white-space: nowrap; }
.pill.rose { background: var(--blush); color: var(--deep); }
.pill.red { background: var(--alertbg); color: var(--alert); }
.pill.warn { background: var(--warnbg); color: var(--warn); }
.pill.soft { background: var(--petal); color: var(--muted); }
.pill.done { background: var(--plum); color: #fff; }

/* doughnut */
.rsvp { display: grid; grid-template-columns: 128px 1fr; gap: 16px; align-items: center; }
.legend { display: grid; gap: 7px; }
.legend div { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend b { margin-left: auto; font-variant-numeric: tabular-nums; }

/* bars */
.bars { display: grid; gap: 10px; }
.bar3 .top3 { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; gap: 8px; }
.bar3 .top3 span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.track { position: relative; height: 10px; border-radius: 99px; background: var(--petal); overflow: hidden; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }

/* chips & segments */
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; margin: 0 -16px; padding-inline: 16px; }
.seg::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font: 600 12.5px var(--body); color: var(--plum); }
.chip[aria-pressed="true"] { background: var(--plum); border-color: var(--plum); color: #fff; }
.chip .n { opacity: .7; margin-left: 4px; font-weight: 500; }

.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
.search svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.search input { border: 0; outline: 0; background: none; font: inherit; padding: 11px 0; width: 100%; color: var(--ink); }

.check { width: 24px; height: 24px; border-radius: 50%; border: 1.6px solid var(--smauve); display: grid; place-items: center; flex: none; color: #fff; }
.check svg { width: 14px; height: 14px; opacity: 0; }
.check.on { background: var(--plum); border-color: var(--plum); }
.check.on svg { opacity: 1; }
.check.sq { border-radius: 7px; }
.row.isdone .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--smauve); }

.avatar { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 600 15px var(--display); color: var(--plum); background: var(--okbg); }
.avatar.b { background: var(--blush); color: var(--deep); }

.grp { font: 600 10.5px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--mauve); padding: 14px 16px 4px; }

.contact { display: flex; gap: 8px; }
.cbtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--petal); color: var(--deep); flex: none; }
.cbtn svg { width: 17px; height: 17px; }

.loose { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.loose div { background: var(--petal); border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; }
.loose b { font: 600 20px var(--display); color: var(--plum); }
.loose .hot b { color: var(--alert); }

.timeline { position: relative; padding: 8px 16px 8px 16px; }
.ev { display: grid; grid-template-columns: 62px 18px 1fr; gap: 8px; padding: 8px 0; }
.ev .tm { font: 600 12px var(--body); color: var(--deep); text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; }
.ev .ln { position: relative; }
.ev .ln::before { content: ""; position: absolute; left: 8px; top: 0; bottom: -16px; width: 1.5px; background: var(--blush); }
.ev:last-child .ln::before { display: none; }
.ev .ln i { position: absolute; left: 3px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--rose); }
.ev .a { font-weight: 600; }
.ev .o { font-size: 12px; color: var(--muted); }

.table-card { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.tcard { background: var(--surface); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
.tcard .h { display: flex; justify-content: space-between; align-items: baseline; }
.tcard .h b { font: 600 20px var(--display); color: var(--deep); }
.tcard .seats { display: flex; flex-wrap: wrap; gap: 3px; }
.tcard .seats i { width: 11px; height: 11px; border-radius: 50%; background: var(--petal); border: 1px solid var(--line); }
.tcard .seats i.f { background: var(--plum); border-color: var(--plum); }
.tcard .ml { font-size: 11px; color: var(--muted); }

.money-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.money-sum div { background: var(--petal); border-radius: 12px; padding: 10px; min-width: 0; }
.money-sum .l { font: 600 9.5px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.money-sum .v { font: 600 20px var(--display); color: var(--deep); font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 12px; font: 600 14px var(--body); background: var(--deep); color: #fff; text-decoration: none; }
.btn.alt { background: var(--surface); color: var(--plum); border: 1px solid var(--line); }
.btn.plum { background: var(--plum); }
.btn svg { width: 17px; height: 17px; }
.btn.sm { padding: 7px 12px; font-size: 12.5px; border-radius: 10px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.note { font-size: 12px; color: var(--muted); }
.proto svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.proto { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--plum); background: var(--okbg); border-radius: 12px; padding: 10px 12px; }

/* selection bar */
.selbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 24px); max-width: 436px; z-index: 9; background: var(--dplum); color: #fff; border-radius: 16px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 14px 30px -12px rgba(85,58,77,.6); }
@media (min-width: 520px) { .selbar { bottom: 104px; } }
.selbar .c { flex: 1; font-weight: 600; font-size: 13px; }
.selbar .btn { background: rgba(255,255,255,.14); padding: 9px 12px; font-size: 12.5px; }
.selbar .btn.w { background: #fff; color: var(--dplum); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(63,42,41,.38); z-index: 20; display: grid; align-items: end; justify-items: center; animation: fade .18s ease; }
.sheet { width: 100%; max-width: 460px; max-height: 88%; overflow-y: auto; background: var(--petal); border-radius: 24px 24px 0 0; padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; animation: up .22s ease; }
.sheet .grab { width: 40px; height: 4px; border-radius: 99px; background: var(--smauve); justify-self: center; }
.sheet .shead { position: sticky; top: -10px; z-index: 3; margin: -10px calc(-1 * max(18px, env(safe-area-inset-left, 0px))) -4px; padding: 10px max(18px, env(safe-area-inset-left, 0px)) 6px; background: var(--petal); display: flex; align-items: center; min-height: 32px; }
.sheet .shead .grab { position: absolute; left: 50%; top: 10px; margin-left: -20px; }
.sheet .sback { display: inline-flex; align-items: center; gap: 1px; height: 30px; max-width: 58%; padding: 0 12px 0 6px; margin-top: 8px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--plum); font: 600 13px var(--body); cursor: pointer; box-shadow: 0 1px 2px rgba(63,42,41,.05); }
.sheet .sback span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet .sback svg { flex: none; }
.sheet .sback:active { background: var(--blush); }
.sheet h4 { font: 600 26px/1.05 var(--display); color: var(--deep); margin: 0; text-wrap: balance; }
.sheet .lead { color: var(--muted); font-size: 13px; margin-top: -8px; }
.kv { background: var(--surface); border-radius: 14px; overflow: hidden; }
.kv div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--petal); font-size: 13.5px; }
.kv div:first-child { border-top: 0; }
.kv span { color: var(--muted); }
.kv b { font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.kv a { color: var(--plum); font-weight: 600; text-decoration: none; }
.sel { appearance: none; border: 1px solid var(--line); background: var(--petal); border-radius: 8px; padding: 5px 26px 5px 10px; font: 600 13px var(--body); color: var(--plum); background-image: linear-gradient(45deg, transparent 50%, var(--plum) 50%), linear-gradient(135deg, var(--plum) 50%, transparent 50%); background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bignum { font: 600 32px var(--display); color: var(--ink); text-align: center; letter-spacing: .02em; user-select: all; }
.callico { width: 64px; height: 64px; border-radius: 50%; background: var(--blush); color: var(--deep); display: grid; place-items: center; justify-self: center; }
.callico svg { width: 28px; height: 28px; }
textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; color: var(--ink); background: var(--surface); resize: vertical; min-height: 96px; }
.bubble { justify-self: end; max-width: 86%; background: var(--plum); color: #fff; padding: 10px 13px; border-radius: 18px 18px 4px 18px; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.phone { background: var(--surface); border-radius: 20px; padding: 14px; display: grid; gap: 8px; border: 1px solid var(--line); ; min-width: 0; }
.rsvp-page { background: var(--surface); border-radius: 18px; overflow: hidden; border: 1px solid var(--line); }
.rsvp-page .hd { background: var(--deep); color: #fff; padding: 18px; text-align: center; }
.rsvp-page .hd b { display: block; font: 600 24px var(--display); }
.rsvp-page .hd span { color: var(--blush); font-size: 12px; }
.rsvp-page .bd { padding: 14px; display: grid; gap: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 13px; animation: up .2s ease; max-width: calc(100% - 32px); }
@keyframes up { from { transform: translateY(16px); opacity: 0; } }
.toast { animation-name: upc; } @keyframes upc { from { transform: translate(-50%, 16px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); }
.qa { font-size: 13px; color: var(--ink); padding: 0 16px 12px 52px; margin-top: -4px; }
.qa .lab { font: 600 10px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--mauve); }
/* ---- v2 additions ---- */
/* polish pass */
.grp, .sect, .top .eyebrow, .qa .lab { color: var(--label); }
input, select, textarea { font-size: 16px !important; }
.sel { font-size: 15px !important; }
.btn, .chip, .tile, .tab, .iconbtn, .cbtn, .check, .switch, .donehead, .steps button { transition: transform .12s ease, background-color .15s ease, opacity .15s; -webkit-tap-highlight-color: transparent; }
.btn:active, .chip:active, .tile:active, .iconbtn:active, .cbtn:active, .steps button:active { transform: scale(.96); }
.tab:active { transform: scale(.92); }
button.row:active, .donehead:active { background: var(--petal); }
.cbtn { width: 40px; height: 40px; }
.check { position: relative; }
.check::after { content: ""; position: absolute; inset: -10px; }
main.enter { animation: enter .22s ease; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }
.sheet { transition: transform .22s ease; touch-action: pan-y; }
.sheet.dragging { transition: none; }
button:disabled { opacity: .45; }
::selection { background: var(--blush); }
.card.flush:not(.donecard):not(:has(.row)):not(:has(.ev)):not(:has(.empty))::after { content: "Nothing here yet."; display: block; padding: 22px 16px; text-align: center; color: var(--muted); }
.tile .v, .money-sum .v, .hero .count b, .loose b, .date b, .tcard .h b { font-family: var(--body) !important; font-weight: 600 !important; letter-spacing: -.02em; }
.tile .v { font-size: 25px !important; }
.hero .count b { font-size: 46px !important; letter-spacing: -.03em; }
.money-sum .v { font-size: 17px !important; }
.loose b { font-size: 17px !important; }
.date b { font-size: 16px !important; }
.tcard .h b { font-family: var(--display) !important; font-size: 20px !important; letter-spacing: 0; }
.vwrap { background: var(--dplum); border-radius: 18px; overflow: hidden; display: grid; place-items: center; padding: 6px; }
.vwrap video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 10px; background: #F7F1EC; }
.opts .chip { padding: 6px 11px; font-size: 12px; }
.sheet { grid-auto-rows: max-content; }
.paper table { font-size: inherit; }
.autos { background: var(--surface); border-radius: 14px; overflow: hidden; }

  const ev = [], add = (uid, s, title, desc, opts = {}) => {
    const lines = ['BEGIN:VEVENT', `UID:${uid}@weddingdesk`, `DTSTAMP:${stamp}`];
    if (opts.time) { const [h, m] = opts.time.split(':'); const st = ymd(s) + 'T' + h.padStart(2, '0') + m.padStart(2, '0') + '00'; lines.push(`DTSTART:${st}`, `DURATION:PT${opts.mins || 30}M`); }

  S.tasks.forEach((t, i) => { if (OPEN(t) && t['Due Date'] && t['Due Date'] >= today) { add('task' + i + '-' + t['Due Date'], t['Due Date'], `Wedding: ${t.Task}`, [t.Owner, t.Notes].filter(Boolean).join(' · '), { alarm: '-PT0M' }); n.t++; } });
  S.payments.forEach((p, i) => { if (p.Status !== 'Paid' && p['Due Date'] && p['Due Date'] >= today) { add('pay' + i + '-' + p['Due Date'], p['Due Date'], `Pay ${p.Vendor}: ${money(p.Amount)}`, [p.Payment, p.Category].filter(Boolean).join(' · '), { alarm: '-P3D' }); n.p++; } });
  S.planner.forEach((e, i) => { if (e.Date && e.Date >= today && e.Time) { add('evt' + i + '-' + e.Date, e.Date, e.Activity, [e['Day Of'], e.Owner, e.Notes].filter(Boolean).join(' · '), { time: e.Time, mins: 30 }); n.s++; } });
  if (!ev.length) return toast('Nothing upcoming to add yet');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//The Wedding Desk//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Wedding Desk', ...ev, 'END:VCALENDAR'].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar' }), url = URL.createObjectURL(blob), a = document.createElement('a');

  try { a.click(); toast(`Calendar file ready: ${n.t} tasks, ${n.p} payments, ${n.s} schedule times`); } catch (e) { toast('Download isn\'t available in this preview'); }
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}

    ['thanks', 'Thank you', 'Thank you!', 'Dear {first},\n\nThank you so much for celebrating with us and for your thoughtful gift. It means the world to us.\n\nWith love,\n{names}'],

TPL.contact = TPL.vendor;
function fillTpl(text, c) {
  const d = S.details, meals = String(d.meals || '').split(',').map(x => x.trim()).filter(Boolean);
  const rsvpline = d.rsvpLink ? `RSVP here: ${d.rsvpLink}` : `Just reply YES or NO${meals.length ? `, and your meal choice (${meals.join(', ')})` : ''}.`;
  const map = { first: c === 'keep' ? '{first}' : c ? (c.first || 'there') : 'there', names: coupleFirsts(), date: d.wd ? longD(d.wd) : 'our wedding day', dateshort: d.wd ? fmtD(d.wd) : 'our wedding day', time: d.time ? time12(d.time) : 'TBD', venue: d.venue || 'our venue', address: venueAddr() || 'address to come', map: venueAddr() ? gmapHref(`${d.venue}, ${venueAddr()}`) : '', rsvpby: d.rsvpBy ? `by ${D(d.rsvpBy).toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}` : 'soon', rsvpline };
  const noNames = !coupleFirsts() || coupleFirsts() === 'us'; if (noNames) map.names = '\u0000';

/* ---------- fill the styled Wedding Desk template with the app's data ---------- */
function fillTemplate(X, buf, S, DATA, XTABS, DCELLS, DATE_COLS, TIME_COLS) {

  ${err ? `<div class="gerr">${esc(err)}</div>` : ''}
  <button class="btn plum" data-g="${isNew ? 'signup' : 'signin'}">${isNew ? 'Create Account' : 'Sign In'}</button>
  ${isNew ? '' : '<p class="gnote">Forgot your password? Ask the person who shared The Wedding Desk with you to reset it.</p>'}`);
}
function gateNewPass(err) {
  gateShell(`<h2>Set a new password</h2><p>Pick a new password for your account.</p>
  ${GPW.replace('__AC__', 'new-password').replace('__PH__', 'At least 8 characters')}
  ${err ? `<div class="gerr">${esc(err)}</div>` : ''}<button class="btn plum" data-g="setpw">Save Password</button>`);
}
function gateProfile(err) {
  gateShell(`<h2>Welcome!</h2><p>Tell us who you are. Everyone in the wedding sees this.</p>
  <div class="field"><label for="g-name">Your name</label><input id="g-name" autocomplete="name" value="${esc(GATE.name)}" placeholder="First and last name"></div>
  <div class="field"><label>Your role in the wedding</label><div class="groles">${ROLES.map(([k, l]) => `<button class="chip" data-g="role" data-v="${k}" aria-pressed="${GATE.role === k}">${l}</button>`).join('')}</div></div>
  ${err ? `<div class="gerr">${esc(err)}</div>` : ''}
  ${GATE.role === 'bride' || GATE.role === 'groom' ? `<button class="btn plum" data-g="start">Start Our Wedding</button><div class="gor">or, if your fiancé(e) already started it</div>` : ''}
  <div class="field"><label for="g-inv">Invite code</label><input id="g-inv" autocapitalize="characters" autocomplete="off" placeholder="From the Bride or Groom"></div>
  <button class="btn ${GATE.role === 'bride' || GATE.role === 'groom' ? 'alt' : 'plum'}" data-g="join">Join With Invite Code</button>
  <div class="glinks"><button data-g="signout">Sign out</button></div>`);
}
const gVal = id => (document.getElementById(id)?.value || '').trim();
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-g]'); if (!b || !CLOUD.sb && b.dataset.g !== 'retry') return;
  const g = b.dataset.g;
  if (g === 'retry') return location.reload();
  if (g === 'mode') { GATE.email = gVal('g-email').toLowerCase() || GATE.email; if (document.getElementById('g-name0')) GATE.name = gVal('g-name0'); GATE.mode = b.dataset.v; return gateEmail(); }
  if (g === 'showpw') { const pw = document.getElementById('g-pw'); const show = pw.type === 'password'; pw.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show'; return; }
  if (g === 'signup' || g === 'signin') {
    GATE.email = gVal('g-email').toLowerCase(); const pw = document.getElementById('g-pw')?.value || '';
    if (g === 'signup') GATE.name = gVal('g-name0');
    if (g === 'signup' && !GATE.name) return gateEmail('Add your name.');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(GATE.email)) return gateEmail('That email doesn’t look right.');
    if (g === 'signup' && pw.length < 8) return gateEmail('Use a password with at least 8 characters.');
    if (!pw) return gateEmail('Enter your password.');
    gateBusy(g === 'signup' ? 'Creating your account…' : 'Signing you in…'); CLOUD.entering = true;
    const r = g === 'signup'
      ? await CLOUD.sb.auth.signUp({ email: GATE.email, password: pw, options: { data: { name: GATE.name } } })
      : await CLOUD.sb.auth.signInWithPassword({ email: GATE.email, password: pw });
    if (r.error) { CLOUD.entering = false; const m = r.error.message || '';
      if (/already|registered|exists/i.test(m)) { GATE.mode = 'have'; return gateEmail('There’s already an account with that email. Sign in instead.'); }
      if (/invalid login|credentials/i.test(m)) return gateEmail('That email and password don’t match. Check for typos and try again.');
      if (/not confirmed/i.test(m)) return gateEmail(HELP_MSG);
      if (/rate|seconds|too many/i.test(m)) return gateEmail('Too many tries. Please wait a minute and try again.');
      if (/password/i.test(m)) return gateEmail(m);
      return gateEmail('Something went wrong. ' + m); }
    if (!r.data.session) { CLOUD.entering = false; GATE.mode = 'have'; return gateEmail(HELP_MSG); }
    return cloudAfterSignIn(r.data.session);
  }
  if (g === 'setpw') {
    const pw = document.getElementById('g-pw')?.value || ''; if (pw.length < 8) return gateNewPass('Use a password with at least 8 characters.');
    gateBusy('Saving…'); const { error } = await CLOUD.sb.auth.updateUser({ password: pw });
    if (error) return gateNewPass('That didn’t work. ' + error.message);
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    const { data: { session } } = await CLOUD.sb.auth.getSession(); toast('Password saved');
    return session ? cloudAfterSignIn(session) : gateEmail();
  }
  if (g === 'role') { GATE.name = gVal('g-name'); GATE.role = b.dataset.v; return gateProfile(); }
  if (g === 'start' || g === 'join') {
    GATE.name = gVal('g-name'); const inv = gVal('g-inv').toUpperCase();
    if (!GATE.name) return gateProfile('Add your name.'); if (!GATE.role) return gateProfile('Pick your role.');
    if (g === 'join' && !inv) return gateProfile('Enter the invite code you were sent.');
    gateBusy(g === 'start' ? 'Setting up your wedding…' : 'Joining the wedding…');
    const r = g === 'start' ? await CLOUD.sb.rpc('wd_create_wedding', { p_name: S.details?.couple || 'Our Wedding', p_my_name: GATE.name, p_my_role: GATE.role })
      : await CLOUD.sb.rpc('wd_join', { p_code: inv, p_my_name: GATE.name, p_my_role: GATE.role });
    if (r.error) return gateProfile(r.error.message.replace(/^.*?: /, ''));
    const { data: m } = await CLOUD.sb.from('members').select('*').eq('wedding_id', r.data).eq('user_id', CLOUD.user.id).single();
    return cloudEnter(m);
  }
  if (g === 'signout') return cloudSignOut();
});
document.addEventListener('keydown', e => { if (e.key !== 'Enter' || !e.target.closest('#gate') || e.target.tagName !== 'INPUT') return; const btn = document.querySelector('#gate [data-g=signup], #gate [data-g=signin], #gate [data-g=setpw]') || (e.target.id === 'g-inv' ? document.querySelector('#gate [data-g=join]') : null); if (btn) { e.preventDefault(); btn.click(); } });
async function cloudSignOut() {
  if (CLOUD.pending && !CLOUD.offline) await cloudPush();
  if (CLOUD.chan) CLOUD.sb.removeChannel(CLOUD.chan);
  try { await CLOUD.sb.auth.signOut(); } catch (e) {}
  cloudForget(); location.reload();
}

/* ---------- Wedding Party, in Settings ---------- */
function partyHTML() {
  const head = n => `<div class="sect">Who Can See This Plan${n ? ` · ${n}` : ''}</div>`;
  if (!CLOUD.wid) return `${head(1)}
  <div class="kv who"><div><span class="whoname"><b>You</b><small>On this phone</small></span><b class="whoacc">Full Control</b></div></div>
  <div class="note">Only you can see this plan. It's saved on this phone and nothing is uploaded. Excel files and PDFs you share are copies, so people who get them can't see your later changes.</div>`;
  const owner = CLOUD.me.access === 'owner', inv = owner ? (CLOUD.invites || []) : [];
  const rows = CLOUD.members.map(m => { const me = m.user_id === CLOUD.user.id, tap = owner && !me;
    return `<div ${tap ? `data-act="member" data-u="${m.user_id}" style="cursor:pointer"` : ''}><span class="whoname"><b>${esc(m.name)}${me ? ' (you)' : ''}</b><small>${esc(ROLE(m.role))}${m.joined_at ? ` · joined ${fmtD(String(m.joined_at).slice(0, 10))}` : ''}</small></span><b class="whoacc">${ACCESS[m.access][0]}${tap ? ' ›' : ''}</b></div>`; }).join('');
  const pend = inv.length ? `<div class="grp" style="margin:12px 2px 6px">Invites Not Used Yet</div><div class="kv who">${inv.map(i => `<div><span class="whoname"><b>Code ${esc(i.code)}</b><small>${ACCESS[i.access][0]} · expires ${fmtD(String(i.expires_at).slice(0, 10))}</small></span><button class="btn sm alt" data-act="invdel" data-c="${esc(i.code)}">Cancel</button></div>`).join('')}</div>` : '';
  return `${head(CLOUD.members.length)}
  <div class="note" style="margin-top:-4px">Signed in as <b style="color:var(--ink)">${esc(CLOUD.me.name)}</b> · ${esc(CLOUD.user.email)}. Everyone below sees the same plan, and changes save for everyone automatically.${owner ? ' Tap a person to change what they can do or remove them.' : ''}</div>
  <div class="kv who">${rows}</div>${pend}
  <div class="sharegrid">${owner ? `<button class="btn plum" data-act="invite">${I.plus} Invite Someone</button>` : ''}<button class="btn alt" data-act="myrole">Change My Role</button></div>
  <div class="sharegrid"><button class="btn alt sm" data-act="mypw">Change Password</button><button class="btn alt sm" data-act="signout">Sign Out</button></div>`;
}
function inviteSheet(access) {
  UI.invAccess = access || UI.invAccess || 'editor';
  sheet(`<h4>Invite Someone</h4><div class="lead">They create an account, then enter the code. Each code works once and lasts 14 days.</div>
  <div class="opts">${Object.entries(ACCESS).map(([k, [l]]) => `<button class="chip" data-act="invacc" data-v="${k}" aria-pressed="${UI.invAccess === k}">${l}</button>`).join('')}</div>
  <div class="note">${ACCESS[UI.invAccess][1]}</div>
  <button class="btn plum" data-act="invmake">Create Invite Code</button><button class="btn alt" data-close="1">Cancel</button>`);
}
async function inviteMake() {
  const { data: code, error } = await CLOUD.sb.rpc('wd_make_invite', { p_wedding: CLOUD.wid, p_access: UI.invAccess, p_note: null });
  if (error) return toast(error.message);
  cloudMembers();
  const msg = `You're invited to help plan ${S.details.couple || 'our wedding'} on The Wedding Desk. Open ${SITE}, tap Create Account, and enter invite code ${code}`;
  UI.invMsg = msg;
  sheet(`<h4>Invite Code</h4><div class="lead">${ACCESS[UI.invAccess][0]} · works once · lasts 14 days</div>
  <div class="invcode">${code}</div><div class="note">${esc(msg)}</div>
  <div class="sharegrid"><button class="btn plum" data-act="invshare">${I.share} Send It</button><button class="btn alt" data-copy="${esc(msg)}">Copy</button></div><button class="btn alt" data-close="1">Done</button>`);
}
function memberSheet(uid) {
  const m = CLOUD.members.find(x => x.user_id === uid); if (!m) return;
  sheet(`<h4>${esc(m.name)}</h4><div class="lead">${esc(ROLE(m.role))} · ${esc(m.email)}</div>
  <div class="opts">${Object.entries(ACCESS).map(([k, [l]]) => `<button class="chip" data-act="memacc" data-u="${uid}" data-v="${k}" aria-pressed="${m.access === k}">${l}</button>`).join('')}</div>
  <div class="note">${ACCESS[m.access][1]}</div>
  <button class="btn alt" data-act="memdel" data-u="${uid}">Remove From the Wedding</button><button class="btn alt" data-close="1">Done</button>`);
}
function myRoleSheet() {
  const own = CLOUD.me.access === 'owner';
  sheet(`<h4>My Role</h4><div class="lead">Everyone in the wedding sees this.</div>
  <div class="opts">${ROLES.filter(([k]) => own || (k !== 'bride' && k !== 'groom')).map(([k, l]) => `<button class="chip" data-act="setrole" data-v="${k}" aria-pressed="${CLOUD.me.role === k}">${l}</button>`).join('')}</div><button class="btn alt" data-close="1">Done</button>`);
}
function myPassSheet(err) {
  sheet(`<h4>Change Password</h4><div class="lead">Pick a new password for ${esc(CLOUD.user.email)}. You'll use it next time you sign in.</div>
  <div class="field"><label for="np-1">New password</label><input id="np-1" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div>
  <div class="field"><label for="np-2">Type it again</label><input id="np-2" type="password" autocomplete="new-password"></div>
  ${err ? `<div class="note" style="color:var(--alert)">${esc(err)}</div>` : ''}
  <button class="btn plum" data-act="savepw">Save Password</button><button class="btn alt" data-close="1">Cancel</button>`);
}
async function cloudAct(ds) {
  if (ds.act === 'mypw') return myPassSheet();
  if (ds.act === 'savepw') { const a = document.getElementById('np-1').value, b = document.getElementById('np-2').value;
    if (a.length < 8) return myPassSheet('Use at least 8 characters.'); if (a !== b) return myPassSheet('Those two don’t match. Try again.');
    const { error } = await CLOUD.sb.auth.updateUser({ password: a }); if (error) return myPassSheet(/fetch|network/i.test(error.message) ? 'You’re offline. Try again when you’re connected.' : error.message);
    closeSheet(); return toast('Password changed'); }
  if (ds.act === 'invite') return inviteSheet();
  if (ds.act === 'invacc') return inviteSheet(ds.v);
  if (ds.act === 'invmake') return inviteMake();
  if (ds.act === 'invshare') { try { await navigator.share({ text: UI.invMsg }); } catch (e) { location.href = 'sms:&body=' + encodeURIComponent(UI.invMsg); } return; }
  if (ds.act === 'member') return memberSheet(ds.u);
  if (ds.act === 'memacc') { const { error } = await CLOUD.sb.from('members').update({ access: ds.v }).eq('wedding_id', CLOUD.wid).eq('user_id', ds.u); if (error) return toast(error.message); await cloudMembers(); toast('Access updated'); return memberSheet(ds.u); }
  if (ds.act === 'memdel') return confirmBox('Remove This Person?', 'They won’t see your wedding any more. You can invite them again later.', 'Remove', async () => { const { error } = await CLOUD.sb.from('members').delete().eq('wedding_id', CLOUD.wid).eq('user_id', ds.u); if (error) return toast(error.message); await cloudMembers(); closeSheet(); toast('Removed'); });
  if (ds.act === 'invdel') return confirmBox('Cancel This Invite?', 'The code will stop working. You can make a new one any time.', 'Cancel Invite', async () => { const { error } = await CLOUD.sb.from('invites').delete().eq('code', ds.c); if (error) return toast(error.message); await cloudMembers(); toast('Invite cancelled'); });
  if (ds.act === 'myrole') return myRoleSheet();
  if (ds.act === 'setrole') { const { error } = await CLOUD.sb.from('members').update({ role: ds.v }).eq('wedding_id', CLOUD.wid).eq('user_id', CLOUD.user.id); if (error) return toast('Couldn’t change your role'); await cloudMembers(); S.role = ds.v; toast(`You’re now ${ROLE(ds.v)}`); return myRoleSheet(); }
  if (ds.act === 'signout') return confirmBox('Sign Out?', CLOUD.pending ? 'Some changes haven’t synced yet and will be lost if you sign out now. Go online first to keep them.' : 'Your wedding stays saved. Sign in again any time with your email and password.', 'Sign Out', cloudSignOut);
}

/* let each sheet opener record itself so Back can reopen it */
for (const n of ["legalSheet", "inviteSheet", "memberSheet", "myRoleSheet", "myPassSheet", "rowForm", "tableSheet", "searchSheet", "callSheet", "dndSheet", "reachSheet", "contactSheet", "mapSheet", "composeSheet", "repliesSheet", "guestSheet", "guestForm", "vendorSheet", "vendorForm", "taskForm", "payForm", "settingsSheet", "helpSheet", "shareSheet", "importSheet"]) { const f = window[n]; if (typeof f !== 'function') continue; window[n] = function (...args) { SH_OPEN = (SH_OPEN && SH_OPEN.back && SH_OPEN.fn === n) ? SH_OPEN : { fn: n, args }; return f.apply(this, args); }; }
cloudInit();
</script>
